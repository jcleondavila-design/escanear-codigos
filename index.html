<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1565c0">
<title>Escanear códigos</title>
<style>
  :root { --bg:#f4f6f8; --card:#ffffff; --txt:#1b1f24; --pri:#1565c0; --good:#2e7d32; --bad:#c62828; --line:#cfd6dd; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:var(--bg); color:var(--txt);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust:100%; touch-action:manipulation; }
  body { padding:16px; max-width:520px; margin:0 auto; padding-bottom:40px; }
  h1 { font-size:26px; margin:6px 0 14px; }
  .card { background:var(--card); border-radius:16px; padding:16px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  label { display:block; font-size:19px; font-weight:600; margin:14px 0 6px; }
  input, textarea { width:100%; font-size:20px; padding:14px; border:2px solid var(--line); border-radius:12px; background:#fff; color:var(--txt); font-family:inherit; }
  textarea { min-height:90px; resize:vertical; }
  .seg { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .seg button { font-size:22px; font-weight:600; padding:20px 10px; border-radius:14px; border:2px solid var(--line); background:#fff; color:var(--txt); min-height:64px; }
  .seg button[aria-pressed="true"] { background:var(--pri); border-color:var(--pri); color:#fff; }
  .btn { width:100%; min-height:72px; font-size:23px; font-weight:700; padding:18px; border:0; border-radius:16px; background:var(--pri); color:#fff; margin-top:12px; font-family:inherit; }
  .btn.save { background:var(--good); }
  .btn.gray { background:#455a64; }
  .btn:disabled { opacity:.5; }
  #video { width:100%; max-height:55vh; background:#000; border-radius:14px; display:none; margin-top:12px; object-fit:cover; }
  #status { font-size:19px; min-height:28px; margin:12px 0 4px; text-align:center; font-weight:600; }
  #status.good { color:var(--good); }
  #status.bad { color:var(--bad); }
  #formato { font-size:17px; color:#55606a; min-height:22px; margin-top:6px; }
</style>
</head>
<body>

<h1>Escanear códigos</h1>

<div class="card">
  <label>Tipo</label>
  <div class="seg" id="tipoSeg">
    <button type="button" data-v="Bodega" aria-pressed="true">Bodega</button>
    <button type="button" data-v="Medidor" aria-pressed="false">Medidor</button>
  </div>
</div>

<div class="card">
  <button class="btn" id="btnScan" type="button">📷 Escanear código</button>
  <video id="video" playsinline muted autoplay></video>
  <div id="status"></div>

  <label for="codigo">Código</label>
  <input id="codigo" inputmode="text" autocomplete="off" autocapitalize="characters" placeholder="Escanea o escribe">
  <div id="formato"></div>

  <label for="cantidad" id="lblCant">Cantidad</label>
  <input id="cantidad" inputmode="decimal" autocomplete="off" placeholder="0">

  <label for="token">Token</label>
  <input id="token" type="password" autocomplete="off" autocapitalize="off" placeholder="Token de acceso">

  <label for="usuario">Usuario</label>
  <input id="usuario" autocomplete="name" placeholder="Tu nombre">

  <label for="notas">Notas</label>
  <textarea id="notas" placeholder="Opcional"></textarea>

  <button class="btn save" id="btnSave" type="button">💾 Guardar</button>
  <button class="btn gray" id="btnClear" type="button">Limpiar</button>
</div>

<script>
  // ===== Configuración =====
  const CONFIG = {
    endpoint: 'https://script.google.com/macros/s/AKfycbx_SBuDhQRbWBKQ9b1uq3TF0pFzUk94Qvig1rwRCl9kCpFu9kA0reSxREbuK0AA_j2L/exec',
    hoja: 'Escaneos'
  };
  const ZXING_URL = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';

  const $ = id => document.getElementById(id);
  let tipo = 'Bodega';
  let scanning = false;
  let stream = null;
  let zxControls = null;

  // ===== Tipo =====
  document.querySelectorAll('#tipoSeg button').forEach(b => {
    b.addEventListener('click', () => {
      tipo = b.dataset.v;
      document.querySelectorAll('#tipoSeg button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      $('lblCant').textContent = tipo === 'Medidor' ? 'Lectura' : 'Cantidad';
    });
  });

  function setStatus(msg, cls) {
    const s = $('status');
    s.textContent = msg;
    s.className = cls || '';
  }

  // ===== Cámara y escaneo =====
  function stopCamera() {
    scanning = false;
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    if (zxControls) { try { zxControls.stop(); } catch (e) {} zxControls = null; }
    const v = $('video');
    v.srcObject = null;
    v.style.display = 'none';
    $('btnScan').textContent = '📷 Escanear código';
  }

  function onCode(code, formato) {
    $('codigo').value = code;
    $('formato').textContent = 'Formato: ' + formato;
    if (navigator.vibrate) navigator.vibrate(120);
    setStatus('Código leído', 'good');
    stopCamera();
  }

  async function startScan() {
    const video = $('video');
    video.style.display = 'block';
    $('btnScan').textContent = '✖ Cancelar escaneo';
    setStatus('Apunta la cámara al código…');
    scanning = true;
    try {
      if ('BarcodeDetector' in window) {
        await scanWithDetector(video);
      } else {
        await scanWithZXing(video);
      }
    } catch (e) {
      setStatus('No se pudo abrir la cámara. Escribe el código a mano.', 'bad');
      stopCamera();
    }
  }

  // Android / navegadores con BarcodeDetector
  async function scanWithDetector(video) {
    const detector = new BarcodeDetector({ formats: ['ean_13', 'code_128'] });
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
    video.srcObject = stream;
    await video.play();
    const loop = async () => {
      if (!scanning) return;
      try {
        const codes = await detector.detect(video);
        if (codes.length && scanning) {
          const c = codes[0];
          const fmt = c.format === 'ean_13' ? 'EAN-13' : c.format === 'code_128' ? 'Code 128' : c.format;
          onCode(c.rawValue, fmt);
          return;
        }
      } catch (e) { /* frame sin datos: seguimos */ }
      setTimeout(loop, 150);
    };
    loop();
  }

  // iPhone / Safari: ZXing
  function loadZXing() {
    if (window.ZXing) return Promise.resolve();
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = ZXING_URL;
      s.onload = resolve;
      s.onerror = () => reject(new Error('ZXing no cargó'));
      document.head.appendChild(s);
    });
  }

  async function scanWithZXing(video) {
    await loadZXing();
    const Z = window.ZXing;
    const hints = new Map();
    hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.CODE_128]);
    hints.set(Z.DecodeHintType.TRY_HARDER, true);
    const reader = new Z.BrowserMultiFormatReader(hints);
    const controls = await reader.decodeFromConstraints(
      { video: { facingMode: { ideal: 'environment' } }, audio: false },
      video,
      (result) => {
        if (result && scanning) {
          const f = result.getBarcodeFormat();
          const fmt = f === Z.BarcodeFormat.EAN_13 ? 'EAN-13' : f === Z.BarcodeFormat.CODE_128 ? 'Code 128' : 'Otro';
          onCode(result.getText(), fmt);
        }
      }
    );
    zxControls = controls;
    if (!scanning) { try { controls.stop(); } catch (e) {} zxControls = null; }
  }

  $('btnScan').addEventListener('click', () => {
    if (scanning) { stopCamera(); setStatus(''); }
    else startScan();
  });

  // Apagar la cámara si cambias de app o pestaña
  document.addEventListener('visibilitychange', () => { if (document.hidden) stopCamera(); });

  // ===== Guardar =====
  function limpiar() {
    $('codigo').value = '';
    $('formato').textContent = '';
    $('cantidad').value = '';
    $('notas').value = '';
  }

  async function guardar() {
    const codigo = $('codigo').value.trim();
    const cantidad = $('cantidad').value.trim();
    if (!codigo) { setStatus('Escanea o escribe el código', 'bad'); return; }
    if (!cantidad) { setStatus(tipo === 'Medidor' ? 'Escribe la lectura' : 'Escribe la cantidad', 'bad'); return; }

    const token = $('token').value.trim();
    if (!token) { setStatus('Escribe el token', 'bad'); return; }

    const usuario = $('usuario').value.trim();
    const formatoTxt = $('formato').textContent.replace('Formato: ', '') || 'Manual';
    const payload = {
      token: token,
      hoja: CONFIG.hoja,
      tipo: tipo,
      codigo: codigo,
      formato: formatoTxt,
      cantidad: cantidad,
      usuario: usuario,
      notas: $('notas').value.trim()
    };

    const btn = $('btnSave');
    btn.disabled = true;
    setStatus('Guardando…');
    try {
      // Apps Script no devuelve cabeceras CORS, así que la respuesta no se puede leer desde la página.
      await fetch(CONFIG.endpoint, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      try { localStorage.setItem('usuario', usuario); localStorage.setItem('token', token); } catch (e) {}
      limpiar();
      setStatus('Enviado a la hoja ✔', 'good');
    } catch (e) {
      setStatus('Sin conexión. No se envió, inténtalo de nuevo.', 'bad');
    } finally {
      btn.disabled = false;
    }
  }

  $('btnSave').addEventListener('click', guardar);
  $('btnClear').addEventListener('click', () => { limpiar(); setStatus(''); });

  // Recordar el usuario en este móvil
  try {
    const u = localStorage.getItem('usuario');
    if (u) $('usuario').value = u;
    const t = localStorage.getItem('token');
    if (t) $('token').value = t;
  } catch (e) {}
</script>
</body>
</html>
